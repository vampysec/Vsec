            <div class="video-item">
              <p class="video-nombre">🎬 ${v.nombre}</p>
              <p style="color:#8b949e; font-size:14px;">${v.descripcion || ''}<p>
              <video controls preload="metadata" src="${v.url}"></video>
            </div>
          `).join('') 
          : '<p style="color:#8b949e">Aún no hay videos en este módulo. Cuando subas tus videos a Catbox, pega aquí el enlace .mp4.</p>'}
      </div>
    `;
  }
  contenidoEl.innerHTML = html;
}
pintarTabs();
pintarContenido();
</script>
</body>
</html>
