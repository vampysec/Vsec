const tabsEl = document.getElementById('tabs');
const contenidoEl = document.getElementById('contenido');
let activo = 'inicio';

function pintarTabs(){
  tabsEl.innerHTML = MODULOS.map(m => 
    `<button onclick="cambiar('${m.id}')" class="${m.id===activo?'active':''}">${m.titulo}</button>`
  ).join('');
}

function cambiar(id){
  activo = id;
  pintarTabs();
  pintarContenido();
  window.scrollTo({top:0, behavior:'smooth'});
}

function pintarContenido(){
  const m = MODULOS.find(x => x.id === activo);
  let html = '';

  if(m.id === 'inicio'){
    html += `
      <div class="hero">
        <div class="sub">VAMPY SECURITY</div>
        <h2>Academia VSEC-MX</h2>
        ${m.teorias.map(t => `<p>${t}</p>`).join('')}
        <div style="margin:20px 0 10px">
          <span class="badge">100% Teórico</span>
          <span class="badge">Formación Sólida</span>
          <span class="badge">Sin Humo</span>
        </div>
        <button class="btn" onclick="cambiar('redes')">Comenzar por Redes →</button>
      </div>
    `;
    MODULOS.slice(1).forEach(mod => {
      html += `
        <div class="modulo-card">
          <h3>${mod.titulo}</h3>
          <p>${mod.subtitulo}</p>
          <button class="btn" onclick="cambiar('${mod.id}')">Entrar al módulo →</button>
        </div>
      `;
    });
  } else {
    html += `
      <div class="hero">
        <div class="sub">VAMPY SECURITY</div>
        <h2>${m.titulo}</h2>
        <p style="color:#8b949e">${m.subtitulo}</p>
      </div>
      <div class="card">
        <h3>Teoría del módulo</h3>
        ${m.teorias.map(t => `<div class="teoria"><p>${t}</p></div>`).join('')}
      </div>
    `;

    if (m.videos && m.videos.length) {
      html += `
        <div class="card">
          <h3>${m.videos.some(v => v.url) ? 'Videos del módulo' : 'Temas del módulo'}</h3>
          ${m.videos.map(v => `
            <div class="video-item">
              <p class="video-nombre">${v.url ? '🎬' : '📖'} ${v.nombre}</p>
              ${v.descripcion ? `<p style="color:#8b949e; font-size:14px; margin-bottom:8px;">${v.descripcion}</p>` : ''}
              ${v.url ? `<video controls preload="metadata" src="${v.url}"></video>` : ''}
              ${v.imagen ? `<img src="${v.imagen}" alt="${v.nombre}" onclick="this.style.maxWidth = (this.style.maxWidth === '420px' ? '95%' : '420px')" style="width:100%; max-width:420px; height:auto; display:block; margin:12px auto; border-radius:10px; cursor:zoom-in;" />` : ''}
            </div>
          `).join('')}
        </div>
      `;
    }
  }

  contenidoEl.innerHTML = html;
}

pintarTabs();
pintarContenido();
